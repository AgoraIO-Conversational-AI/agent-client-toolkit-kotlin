name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt -r requirements-dev.txt

      - name: Check backend sources
        run: .venv/bin/python -m py_compile src/*.py

      - name: Test backend
        run: .venv/bin/python -m pytest -q

  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew :conversational-ai:testDebugUnitTest :app:testDebugUnitTest

      - name: Lint and build demo
        run: ./gradlew :conversational-ai:lintDebug :app:lintDebug :app:assembleDebug
